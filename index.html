<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tu Tiên Ký</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&display=swap">
<style>
:root{--bg:#e8eeeb;--panel:#f5f8f6;--ink:#1c2b29;--mute:#5d716d;--jade:#2e7d6c;--gold:#a8812e;--seal:#a63a32;--line:#c5d2cd;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a19;--panel:#182523;--ink:#e3ece9;--mute:#8fa5a0;--jade:#4fb89f;--gold:#d2a94b;--seal:#e0685e;--line:#2c3f3c}}
:root[data-theme="dark"]{--bg:#101a19;--panel:#182523;--ink:#e3ece9;--mute:#8fa5a0;--jade:#4fb89f;--gold:#d2a94b;--seal:#e0685e;--line:#2c3f3c}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Serif",Georgia,"Times New Roman",serif;line-height:1.55}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:8px 0 16px}
.ring{--p:0;width:190px;height:190px;border-radius:50%;display:grid;place-items:center;
background:conic-gradient(var(--jade) calc(var(--p)*1%),var(--line) 0)}
.ring>div{width:164px;height:164px;border-radius:50%;background:var(--bg);display:grid;place-content:center;padding:8px}
.realm{font-size:26px;font-weight:700;line-height:1.2}
.sub{font-size:13px;color:var(--mute)}
.root{margin-top:10px;font-size:14px;color:var(--gold)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.stat b{display:block;font-size:18px}
.stat span{font-size:12px;color:var(--mute)}
.life{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:14px}
.life i{display:block;height:100%;background:var(--seal);width:0}
.acts{display:grid;grid-template-columns:1fr;gap:10px}
button{font:inherit;font-size:15px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:15px 12px;width:100%;cursor:pointer}
button:hover:not(:disabled){border-color:var(--jade)}
button:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
button.main{grid-column:1/-1;background:var(--jade);color:#fff;border-color:var(--jade);font-weight:700}
button.seal{background:var(--seal);color:#fff;border-color:var(--seal);font-weight:700}
.on{border-color:var(--jade);box-shadow:inset 0 0 0 1px var(--jade)}
#log{margin-top:18px;border-top:1px solid var(--line);padding-top:10px;font-size:14px;max-height:300px;overflow-y:auto}
#log p{margin:0 0 6px}
#log .g{color:var(--jade)}#log .b{color:var(--seal)}#log .y{color:var(--gold)}
#roll,#ev{position:fixed;inset:0;z-index:10;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));text-align:center}
#roll[hidden],#ev[hidden]{display:none}
#roll .big{font-size:30px;font-weight:700}
#roll .acts,#ev .acts{width:100%;max-width:420px;margin-top:8px}
.evt{font-size:18px;max-width:420px;line-height:1.6}
.foot{margin-top:14px;font-size:12px;color:var(--mute);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.foot button{font-size:12px;padding:4px 8px;width:auto}
@media (prefers-reduced-motion:no-preference){.ring{transition:background .2s}}
</style>
</head>
<body>
<div id="ev" hidden>
<div class="sub">Cơ duyên ngẫu nhiên</div>
<div class="evt" id="evT"></div>
<div class="acts" id="evO"></div>
</div>
<div id="roll" hidden>
<div class="sub">Kiếp thứ <span id="rGen"></span><span id="rN" hidden></span></div>
<div class="big" id="rRoot"></div>
<div class="root" id="rTal"></div>
<div class="sub" id="rMult"></div>
<div class="acts">

<button id="rAuto">Tự động roll</button>
<button class="main" id="rGo">Chọn và bắt đầu tu tiên</button>
</div>
<div class="sub">Mỗi kiếp chỉ được roll một lần, không roll lại được. Muốn roll lại, ngươi phải chết và chuyển thế.</div>
<div class="sub" style="margin-top:14px">Tác giả: nhocsukiem. Góp ý: Trinh Dat.</div>
</div>
<main>
<section class="hero">
<div class="ring" id="ring"><div><div class="realm" id="realm"></div><div class="sub" id="qi"></div></div></div>
<div class="root" id="root"></div>
</section>
<div class="stats">
<div class="stat"><b id="age"></b><span>Tuổi</span></div>
<div class="stat"><b id="stone"></b><span>Linh thạch</span></div>
<div class="stat"><b id="legacy"></b><span>Đạo duyên (kiếp <span id="gen"></span>)</span></div>
</div>
<div class="life" title="Thọ nguyên"><i id="lifebar"></i></div>
<div class="sub" id="inv" style="margin:-6px 0 12px"></div>
<div class="acts">
<button class="main" id="bCult">Tu luyện (1 tháng)</button>
<button id="bYear">Bế quan (1 năm)</button>
<button id="bExp">Thám hiểm (3 tháng)</button>

<button id="bStone">Dùng linh thạch hộ pháp</button>
<button id="bPlant">Thúc linh thảo bằng bình (6 tháng)</button>
<button id="bAlch">Luyện đan (3 linh thảo)</button>
<button id="bPill" style="grid-column:1/-1">Uống đan dược</button>
<button id="bHealP">Chữa thương bằng đan dược (khỏi hẳn)</button>
<button id="bHealS">Chữa thương bằng 2 linh thạch (giảm một bậc)</button>
<button class="seal" id="bBreak" style="grid-column:1/-1">Đột phá</button>
</div>
<div id="log"></div>
<div class="foot"><span>Mỗi điểm đạo duyên tăng 5% tốc độ tu luyện ở kiếp sau.</span><button id="bReset">Chơi lại từ đầu</button></div>
<div class="sub" style="margin-top:16px;text-align:center">Tác giả: nhocsukiem. Góp ý: Trinh Dat.</div>
</main>
<script>
const REALMS=["Luyện Khí","Trúc Cơ","Kết Đan","Nguyên Anh","Hóa Thần","Phi Thăng"];
const LIFE=[80,160,320,640,1280,9999];
const CHANCE=[.7,.6,.5,.4,.3];
const ROOTS=[["Kim linh căn",1.1],["Mộc linh căn",1.1],["Thủy linh căn",1.1],["Hỏa linh căn",1.2],["Thổ linh căn",1.0],["Phế linh căn",.6],["Song linh căn",1.4],["Thiên linh căn",2.0]];
const KEY="tutien_save_v1";
let S,auto=null;
const $=id=>document.getElementById(id);
const rnd=n=>Math.floor(Math.random()*n);

const TALENTS=[["Hạ phẩm",.8],["Trung phẩm",1],["Thượng phẩm",1.25],["Thiên tài",1.6]];
function rollTraits(){
  const r=ROOTS[Math.random()<.04?7:rnd(7)];
  const x=Math.random(),t=TALENTS[x<.4?0:x<.8?1:x<.95?2:3];
  return {root:r[0],tname:t[0],mult:Math.round(r[1]*t[1]*100)/100};
}
function newLife(legacy,gen){
  const r=rollTraits();
  return {m:16*12,realm:0,qi:0,stone:0,herb:0,pill:0,alch:0,boost:0,root:r.root,tname:r.tname,mult:r.mult,rolling:true,rolled:false,rolls:1,legacy:legacy,gen:gen,life:LIFE[0],dead:false,log:[]};
}
function load(){try{const v=localStorage.getItem(KEY);if(v)return JSON.parse(v)}catch(e){}return null}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function say(t,c){S.log.unshift({t:t,c:c||""});S.log=S.log.slice(0,40)}
const need=()=>100*Math.pow(4,S.realm);
const gain=()=>Math.max(1,Math.round(4*Math.pow(3,S.realm)*S.mult*(1+.05*S.legacy)*[1,.6,.3][S.hurt||0]));
const age=()=>Math.floor(S.m/12);

function advance(months){
  S.m+=months;if(S.hurt>0){S.hm=(S.hm||0)+months;if(S.hm>=(S.hurt==2?60:36)){S.hurt--;S.hm=0;say('Thương thế đã thuyên giảm theo thời gian.','g')}}S.evT=(S.evT===undefined?nextEv():S.evT)-months;S.pT=(S.pT===undefined?nextP():S.pT)-months;if(S.pT<=0&&age()<S.life){S.pT=nextP();passive()}if(age()<S.life&&S.ev==null&&S.evT<=0)raiseEvent();
  if(age()>=S.life)die();
}
function die(){S.ev=null;
  stopAuto();
  S.dead=true;
  const pts=S.realm*3+1;
  say("Thọ nguyên cạn kiệt, ngươi tọa hóa ở tuổi "+age()+" với cảnh giới "+REALMS[S.realm]+". Nhận "+pts+" đạo duyên.","b");
  S.legacy+=pts;
}
function reborn(){
  const L=S.legacy,G=S.gen+1;
  S=newLife(L,G);
  say("Chuyển thế luân hồi, kiếp thứ "+G+".","y");
  render();save();
}
function cult(months){
  if(S.dead)return;
  const max=need();
  if(S.realm>=5)return;
  if(S.qi>=max){say("Tu vi đã viên mãn, hãy thử đột phá.","y");stopAuto();return}
  S.qi=Math.min(max,S.qi+gain()*months);
  advance(months);
  if(!S.dead&&S.qi>=max){say("Linh khí đã đầy, có thể đột phá "+REALMS[S.realm+1]+".","g");stopAuto()}
}
const EVENTS=[
 ()=>{const q=gain()*6;S.qi=Math.min(need(),S.qi+q);say("Hái được một gốc linh thảo trăm năm, tu vi tăng "+q+".","g")},
 ()=>{const n=1+rnd(3);S.stone+=n;say("Nhặt được "+n+" khối linh thạch bên khe suối.","g")},
 ()=>{if(Math.random()<.5+S.realm*.05){S.stone+=2;say("Chém giết yêu thú, thu được 2 linh thạch.","g")}else{S.qi=Math.floor(S.qi*.8);hurtUp(1);say("Bị yêu thú đánh trọng thương, hao tổn 20% tu vi và bị thương nhẹ.","b")}},
 ()=>{S.life+=10;say("Gặp một vị cao nhân chỉ điểm, thọ nguyên tăng thêm 10 năm.","y")},
 ()=>{const q=gain()*20;S.qi=Math.min(need(),S.qi+q);say("Tình cờ phát hiện một bí cảnh, thu hoạch rất lớn: tu vi tăng "+q+".","y")},
 ()=>{if(S.stone>0){S.stone--;say("Bị tu sĩ cướp đường, mất 1 linh thạch.","b")}else{S.m+=12;say("Bị truy sát, phải ẩn náu suốt một năm.","b")}},
 ()=>say("Đi cả tháng trời, chỉ thấy núi non trùng điệp."),
 ()=>{const n=1+rnd(2);S.herb+=n;say("Phát hiện linh thảo mọc trên vách núi, hái được "+n+" gốc.","g")},
 ()=>{if(Math.random()<.75){S.stone+=3;S.pill++;say("Bắt gặp một tu sĩ lạc đơn, ra tay đoạt túi trữ vật: 3 linh thạch và 1 viên đan dược.","y")}else{S.qi=Math.floor(S.qi*.7);S.m+=12;say("Tưởng là con mồi, hóa ra là kẻ có chống lưng. Ngươi trốn chạy suốt một năm, mất 30% tu vi.","b")}}
];
function explore(){
  if(S.dead)return;
  if(S.ev==null&&Math.random()<.5)raiseEvent();else EVENTS[rnd(EVENTS.length)]();
  advance(3);
}
function useStone(){
  if(S.dead||S.stone<1||S.boost>=3)return;
  S.stone--;S.boost++;
  say("Bày linh thạch hộ pháp, xác suất đột phá +10%.","g");
}
function breakthrough(){
  if(S.dead||S.qi<need())return;
  const p=Math.max(.05,Math.min(.95,CHANCE[S.realm]+.1*S.boost+.01*S.legacy-.15*(S.hurt||0)));
  S.boost=0;
  if(Math.random()<p){
    S.realm++;S.qi=0;
    S.life=Math.max(S.life,LIFE[S.realm]);
    if(S.realm===5){
      const pts=15;S.legacy+=pts;
      say("Thiên kiếp giáng xuống, ngươi vượt qua tất cả và phi thăng tiên giới! Nhận "+pts+" đạo duyên. Bắt đầu kiếp mới để tiếp tục.","y");
      S.dead=true;stopAuto();
    }else say("Đột phá thành công! Ngươi đã đạt cảnh giới "+REALMS[S.realm]+".","y");
  }else{
    const x=Math.random();S.m+=24;if(x<.5){S.qi=Math.floor(S.qi*.6);hurtUp(1)}else if(x<.85){S.qi=Math.floor(S.qi*.4);hurtUp(2)}else{S.qi=Math.floor(S.qi*.4);hurtUp(2);S.mult=Math.round(S.mult*90)/100}
    say("Đột phá thất bại (xác suất "+Math.round(p*100)+"%). "+(x<.5?"Tâm ma xâm nhập, mất 40% tu vi, bị thương nhẹ.":x<.85?"Kinh mạch tổn thương, mất 60% tu vi, bị trọng thương.":"Căn cơ bị hư hỏng, mất 60% tu vi, trọng thương và tốc độ tu luyện vĩnh viễn giảm 10%.")+" Hao tổn 2 năm thọ nguyên.","b");
    if(age()>=S.life)die();
  }
}
function plant(){
  if(S.dead)return;
  S.herb+=2;
  say("Nhỏ vài giọt dịch từ chiếc bình nhỏ, sáu tháng sau thu được 2 gốc linh thảo.","g");
  advance(6);
}
function alchemy(){
  if(S.dead||S.herb<3)return;
  S.herb-=3;
  const p=Math.min(.9,.5+.05*S.alch);
  if(Math.random()<p){S.pill++;S.alch++;say("Luyện đan thành công, được 1 viên đan dược (xác suất "+Math.round(p*100)+"%).","g")}
  else say("Lò đan nổ tung, mất 3 gốc linh thảo (xác suất "+Math.round(p*100)+"%).","b");
  advance(2);
}
function eatPill(){
  if(S.dead||S.pill<1||S.realm>=5||S.qi>=need())return;
  S.pill--;
  const q=gain()*15;
  S.qi=Math.min(need(),S.qi+q);
  say("Uống đan dược, tu vi tăng "+q+".","g");
}
const EV=[
 {t:'Ngươi phát hiện một gốc linh dược trăm năm mọc bên vách đá, nhưng có yêu thú canh giữ gần đó.',o:[
  {l:'Liều mạng đoạt lấy',f:()=>{if(Math.random()<.55){S.herb+=4;say('Ngươi liều mạng hạ yêu thú, hái được 4 gốc linh thảo quý.','g')}else{S.qi=Math.floor(S.qi*.6);S.m+=12;hurtUp(2);say('Yêu thú quá mạnh, ngươi trọng thương, mất 40% tu vi và nằm dưỡng thương một năm.','b')}}},
  {l:'Dùng 1 linh thạch bày trận dụ yêu thú đi (thành công 85%)',ok:()=>S.stone>=1,f:()=>{S.stone--;if(Math.random()<.85){S.herb+=4;say('Trận pháp dụ được yêu thú đi, ngươi hái được 4 gốc linh thảo quý.','g')}else say('Kế hoạch bại lộ, ngươi bỏ chạy và mất trắng 1 linh thạch.','b')}},
  {l:'Bỏ qua, giữ mạng quan trọng hơn',f:()=>say('Ngươi lặng lẽ rời đi. Sống sót mới là trên hết.')}]},
 {t:'Một tu sĩ lạc đơn đi ngang qua, túi trữ vật căng phồng, hắn chưa phát hiện ra ngươi.',o:[
  {l:'Ra tay giết người đoạt bảo',f:()=>{if(Math.random()<.75){S.stone+=3;S.pill++;say('Ngươi ra tay dứt khoát, thu được 3 linh thạch và 1 viên đan dược.','y')}else{S.qi=Math.floor(S.qi*.7);S.m+=12;hurtUp(1);say('Hắn có chống lưng, ngươi trốn chạy một năm, mất 30% tu vi và bị thương nhẹ.','b')}}},
  {l:'Kết giao làm quen',f:()=>{if(Math.random()<.5){S.stone+=2;say('Hắn dễ gần, tặng ngươi 2 linh thạch làm quà gặp mặt.','g')}else say('Hắn lạnh nhạt bỏ đi, ngươi chẳng được gì.')}},
  {l:'Lẳng lặng tránh đi',f:()=>say('Ngươi tránh mặt hắn, không rước họa vào thân.')}]},
 {t:'Một bí cảnh cổ xưa hé mở, linh khí cuồn cuộn, nhưng nghe nói nhiều người vào không có ra.',o:[
  {l:'Tiến vào thám hiểm',f:()=>{const x=Math.random();if(x<.5){const q=gain()*30;S.qi=Math.min(need(),S.qi+q);say('Ngươi thu hoạch lớn trong bí cảnh, tu vi tăng '+q+'.','y')}else if(x<.7){S.life+=10;say('Trong bí cảnh có di tích cổ, thọ nguyên của ngươi tăng thêm 10 năm.','y')}else{S.qi=Math.floor(S.qi*.75);S.m+=36;say('Ngươi lạc trong bí cảnh ba năm, thoát ra được nhưng mất 25% tu vi.','b')}}},
  {l:'Không vào, ở lại tĩnh tu',f:()=>{S.qi=Math.min(need(),S.qi+gain()*2);say('Ngươi từ bỏ cơ duyên, ở lại tĩnh tu, tu vi tăng nhẹ.')}}]},
 {t:'Một lão giả bày quán ven đường, rao bán một bộ công pháp cổ.',o:[
  {l:'Bỏ 2 linh thạch mua công pháp (thật 70%)',ok:()=>S.stone>=2,f:()=>{S.stone-=2;if(Math.random()<.7){S.mult=Math.round(S.mult*115)/100;say('Công pháp là thật, tốc độ tu luyện vĩnh viễn tăng 15% (x'+S.mult+').','y')}else say('Công pháp là đồ giả, ngươi mất 2 linh thạch.','b')}},
  {l:'Không mua',f:()=>say('Ngươi lắc đầu bỏ đi.')}]},
 {t:'Ngươi ghé phường thị, có người rao mua bán đan dược.',o:[
  {l:'Mua 1 đan dược (2 linh thạch)',ok:()=>S.stone>=2,f:()=>{S.stone-=2;S.pill++;say('Ngươi mua được 1 viên đan dược.','g')}},
  {l:'Bán 1 đan dược (được 2 linh thạch)',ok:()=>S.pill>=1,f:()=>{S.pill--;S.stone+=2;say('Ngươi bán đan dược, được 2 linh thạch.','g')}},
  {l:'Chỉ xem rồi đi',f:()=>say('Ngươi dạo một vòng rồi rời phường thị.')}]},
 {t:'Ngươi gặp một lão giả bị thương nặng bên đường, thều thào xin một viên đan dược.',o:[
  {l:'Cho ông ta 1 đan dược',ok:()=>S.pill>=1,f:()=>{S.pill--;if(Math.random()<.5){S.life+=15;say('Lão giả hóa ra là cao nhân ẩn mình, chỉ điểm giúp thọ nguyên của ngươi tăng thêm 15 năm.','y')}else say('Ông ta uống đan rồi lặng lẽ đi mất, ngươi chẳng nhận được gì.')}},
  {l:'Làm ngơ',f:()=>say('Ngươi bước qua, không ngoảnh lại.')}]},
 {t:'Ngươi tình cờ phát hiện một hang động bí ẩn, từ bên trong tỏa ra linh khí nhàn nhạt. Có vào khám phá hay không?',o:[
  {l:'Vào khám phá',f:()=>{const x=Math.random();if(x<.4){const q=gain()*12;S.qi=Math.min(need(),S.qi+q);S.stone+=2;say('Trong hang có di vật của một vị tiền bối, ngươi thu được '+q+' tu vi và 2 linh thạch.','y')}else if(x<.7){S.herb+=3;say('Cuối hang mọc đầy linh thảo, ngươi hái được 3 gốc.','g')}else{S.qi=Math.floor(S.qi*.7);S.m+=24;say('Hang động có độc trùng và cấm chế, ngươi thoát ra sau hai năm, mất 30% tu vi.','b')}}},
  {l:'Không vào',f:()=>say('Ngươi nhìn hang động một lúc rồi quay đi. Cẩn thận mới sống lâu.')}]},
 {t:'Ngươi thấy một ngôi miếu cổ đổ nát, bên trong có bức tượng đá tỏa ánh sáng lạ. Có vào bái lạy không?',o:[
  {l:'Vào bái lạy',f:()=>{const x=Math.random();if(x<.5){S.life+=8;say('Tuợng đá phát sáng, ban cho ngươi thọ nguyên tăng thêm 8 năm.','y')}else if(x<.8){S.stone+=1;say('Ngươi nhặt được 1 linh thạch dưới chân tượng.','g')}else{S.qi=Math.floor(S.qi*.85);S.m+=12;say('Miếu có tà khí, ngươi bị ám và phải dưỡng thương một năm, mất 15% tu vi.','b')}}},
  {l:'Không vào',f:()=>say('Ngươi chắp tay vái một cái rồi đi tiếp.')}]},
 {t:'Một đoàn thương nhân mời ngươi đi cùng một chuyến buôn đường xa, hứa chia lợi. Có tham gia không?',o:[
  {l:'Tham gia',f:()=>{if(Math.random()<.6){S.stone+=4;say('Chuyến đi suôn sẻ, ngươi chia được 4 linh thạch.','g')}else{S.stone=Math.max(0,S.stone-1);S.m+=12;say('Đoàn bị cướp giữa đường, ngươi mất 1 linh thạch và mất một năm.','b')}}},
  {l:'Không tham gia',f:()=>say('Ngươi từ chối, ở lại tu luyện.')}]},
 {c:()=>S.realm>=1,t:'Một tu sĩ có cảnh giới cao hơn chặn đường, đòi ngươi nộp linh thạch mua mạng.',o:[
  {l:'Nộp 2 linh thạch',ok:()=>S.stone>=2,f:()=>{S.stone-=2;say('Ngươi nuốt giận nộp 2 linh thạch, hắn bỏ đi.','b')}},
  {l:'Liều chiến (thắng 40%)',f:()=>{if(Math.random()<.4){S.stone+=4;S.pill++;say('Ngươi liều mạng phản kích, hạ được hắn và thu 4 linh thạch cùng 1 viên đan dược.','y')}else{S.qi=Math.floor(S.qi*.5);hurtUp(2);say('Ngươi bại trận, mất 50% tu vi và bị trọng thương.','b')}}},
  {l:'Bỏ chạy (thoát 60%)',f:()=>{if(Math.random()<.6)say('Ngươi dùng thân pháp thoát được.');else{S.qi=Math.floor(S.qi*.8);hurtUp(1);say('Ngươi bị đuổi kịp, bị thương nhẹ và mất 20% tu vi.','b')}}}]},
 {c:()=>S.realm>=1,t:'Một tông môn nhỏ mời ngươi làm khách khanh, bù lại ngươi phải làm việc cho họ hai năm.',o:[
  {l:'Nhận lời',f:()=>{S.stone+=3;S.pill++;S.m+=24;say('Ngươi làm việc cho tông môn hai năm, nhận 3 linh thạch và 1 viên đan dược.','g')}},
  {l:'Từ chối',f:()=>say('Ngươi khéo léo từ chối, vẫn một mình tu hành.')}]}
];
function raiseEvent(){const ok=[];EV.forEach((e,i)=>{if(!e.c||e.c())ok.push(i)});S.ev=ok[rnd(ok.length)];S.evT=nextEv();stopAuto()}
function pick(i){const o=EV[S.ev].o[i];if(o.ok&&!o.ok())return;S.ev=null;o.f();if(!S.dead&&age()>=S.life)die();render();save();startAuto()}
let rt=null,resetArm=false;
function stopRoll(){if(rt){clearInterval(rt);rt=null}}
function reroll(){const r=rollTraits();S.root=r.root;S.tname=r.tname;S.mult=r.mult;S.rolls++}
function toggleRoll(){
  if(rt){stopRoll();render();return}if(S.rolled)return;
  S.rolled=true;
  reroll();
  render();
}
function startLife(){
  stopRoll();S.rolling=false;setTimeout(startAuto,0);
  say("Ngươi là thiếu niên 16 tuổi, sinh ra với "+S.root+", tư chất "+S.tname+" (x"+S.mult+"). Trong tay có chiếc bình nhỏ màu xanh kỳ lạ, có thể thúc linh thảo mau lớn. Hãy sống sót và tu tiên.","y");
  render();save();
}
function stopAuto(){if(auto){clearInterval(auto);auto=null}}
const nextEv=()=>Math.max(6,Math.round(-Math.log(1-Math.random())*72));
const nextP=()=>Math.max(2,Math.round(-Math.log(1-Math.random())*30));
const PASS=[
 ()=>{const q=gain()*3;S.qi=Math.min(need(),S.qi+q);say('Linh khí quanh núi bất chợt dồi dào, tu vi tăng '+q+'.','g')},
 ()=>{S.qi=Math.floor(S.qi*.97);say('Năm nay đại hạn, linh khí loãng đi, tu vi hao nhẹ.','b')},
 ()=>{S.stone++;say('Ngươi nhặt được 1 linh thạch bên đường.','g')},
 ()=>say('Nghe tin một tông môn nhỏ bị diệt môn, ngươi càng thêm cẩn trọng.'),
 ()=>{if(!S.hurt){hurtUp(1);say('Trúng phải độc khí nơi đầm lầy, ngươi bị thương nhẹ.','b')}else say('Trời đổ mưa suốt nửa tháng, thương thế của ngươi nhức nhối.')},
 ()=>{const q=gain()*2;S.qi=Math.min(need(),S.qi+q);say('Nhìn sao băng vụt qua, tâm cảnh thông suốt, tu vi tăng '+q+'.','g')},
 ()=>say('Một đạo hữu quen biết năm xưa đã qua đời, ngươi lặng người nhìn trời.')
];
function passive(){PASS[rnd(PASS.length)]()}
function hurtUp(n){S.hurt=Math.max(S.hurt||0,n);S.hm=0}
function healPill(){if(S.dead||!S.hurt||S.pill<1)return;S.pill--;S.hurt=0;S.hm=0;say('Uống đan dược chữa thương, thương thế đã khỏi hẳn.','g')}
function healStone(){if(S.dead||!S.hurt||S.stone<2)return;S.stone-=2;S.hurt--;S.hm=0;say('Dùng linh thạch hóa giải ám thương, thương thế giảm một bậc.','g')}
function startAuto(){if(auto||S.dead||S.rolling||S.ev!=null)return;if(S.realm<5&&S.qi>=need())return;auto=setInterval(()=>{cult(1);render();save()},600);render()}
function toggleAuto(){
  if(auto){stopAuto()}else startAuto();
  render();
}
function render(){
  const dead=S.dead,max=S.realm<5?need():1;
  const hasEv=S.ev!=null&&!S.dead;
  $("ev").hidden=!hasEv;
  if(hasEv){const e=EV[S.ev];$("evT").textContent=e.t;const box=$("evO");box.innerHTML='';e.o.forEach((o,i)=>{const b=document.createElement('button');b.textContent=o.l;b.disabled=!!(o.ok&&!o.ok());b.onclick=()=>pick(i);box.appendChild(b)})}
  $("roll").hidden=!S.rolling;
  $("rGen").textContent=S.gen;$("rN").textContent=S.rolls;
  $("rRoot").textContent=S.rolled?S.root:"Linh căn chưa xác định";$("rTal").textContent=S.rolled?"Tư chất: "+S.tname:"Tư chất chưa xác định";
  $("rMult").textContent=S.rolled?"Tốc độ tu luyện x"+S.mult:"Hãy roll để biết số phận của ngươi.";
  $("rAuto").textContent=S.rolled?"Đã roll":"Roll linh căn và tư chất";
  $("rAuto").disabled=S.rolled;
  $("rGo").disabled=!S.rolled;
  $("realm").textContent=REALMS[S.realm];
  $("qi").textContent=S.realm<5?"Tu vi "+Math.floor(S.qi)+" / "+max:"Đã phi thăng";
  $("ring").style.setProperty("--p",S.realm<5?Math.min(100,S.qi/max*100):100);
  $("root").textContent=S.root+", tư chất "+S.tname+" (x"+S.mult+")";
  $("age").textContent=age()+" / "+(S.life>=9999?"∞":S.life);
  $("stone").textContent=S.stone;
  $("legacy").textContent=S.legacy;
  $("gen").textContent=S.gen;
  $("lifebar").style.width=Math.min(100,age()/S.life*100)+"%";
  const full=S.qi>=max&&S.realm<5;
  $("bCult").disabled=dead||full||S.realm>=5;
  $("bYear").disabled=dead||full||S.realm>=5;
  $("bExp").disabled=dead;
  $("bPlant").disabled=dead;
  $("bAlch").disabled=dead||S.herb<3;
  $("bPill").disabled=dead||S.pill<1||full||S.realm>=5;
  $("inv").textContent="Linh thảo: "+S.herb+", đan dược: "+S.pill+", kinh nghiệm luyện đan: "+S.alch+", thương thế: "+["không","nhẹ","nặng"][S.hurt||0];
  $("bHealP").disabled=dead||!S.hurt||S.pill<1;
  $("bHealS").disabled=dead||!S.hurt||S.stone<2;
  
  
  
  $("bStone").disabled=dead||S.stone<1||S.boost>=3;
  $("bStone").textContent="Linh thạch hộ pháp ("+S.boost+"/3)";
  const p=S.realm<5?Math.max(5,Math.min(95,Math.round((CHANCE[S.realm]+.1*S.boost+.01*S.legacy-.15*(S.hurt||0))*100))):0;
  $("bBreak").textContent=dead?"Chuyển thế luân hồi":"Đột phá"+(S.realm<5?" ("+p+"%)":"");
  $("bBreak").disabled=!dead&&!full;
  $("log").innerHTML=S.log.map(l=>'<p class="'+l.c+'">'+l.t+'</p>').join("");
}
$("bCult").onclick=()=>{cult(1);render();save()};
$("bYear").onclick=()=>{cult(12);render();save()};
$("bExp").onclick=()=>{explore();render();save()};

$("bPlant").onclick=()=>{plant();render();save()};

$("rAuto").onclick=toggleRoll;
$("rGo").onclick=startLife;
$("bHealP").onclick=()=>{healPill();render();save()};
$("bHealS").onclick=()=>{healStone();render();save()};
$("bAlch").onclick=()=>{alchemy();render();save()};
$("bPill").onclick=()=>{eatPill();render();save()};
$("bStone").onclick=()=>{useStone();render();save()};
$("bBreak").onclick=()=>{if(S.dead)reborn();else{breakthrough();render();save();startAuto()}};
$("bReset").onclick=()=>{if(!resetArm){resetArm=true;$("bReset").textContent="Bấm lần nữa để xác nhận";setTimeout(()=>{resetArm=false;$("bReset").textContent="Chơi lại từ đầu"},3000);return}resetArm=false;$("bReset").textContent="Chơi lại từ đầu";stopAuto();stopRoll();S=newLife(0,1);render();save()};
S=null;
if(!S||!S.root||S.rolls===undefined){S=newLife(0,1)}
setTimeout(startAuto,0);
render();
</script>
</body>
</html>
