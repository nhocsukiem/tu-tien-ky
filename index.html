<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tu Tiên Ký</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="ev" hidden><div class="card">
<div class="evh">Cơ duyên ngẫu nhiên</div>
<div class="evt" id="evT"></div>
<div class="acts" id="evO"></div></div>
</div>
<div id="roll" hidden>
<div class="sub">Kiếp thứ <span id="rGen"></span><span id="rN" hidden></span></div>
<input id="nameIn" maxlength="20" placeholder="Đặt tên nhân vật" autocomplete="off">
<div class="big" id="rRoot"></div>
<div class="root" id="rTal"></div>
<div class="sub" id="rMult"></div>
<div class="acts">

<button id="rAuto">Tự động roll</button>
<button class="main" id="rGo">Bắt đầu tu tiên</button>
</div>
<div class="sub">Mỗi kiếp chỉ được chọn một lần. Muốn chọn lại, ngươi phải chết và chuyển thế.</div>
<div class="sub" style="margin-top:14px">Tác giả: nhocsukiem. Góp ý: Trinh Dat.</div>
</div>
<main>
<section class="hero">
<div class="sub" id="pname" style="font-size:17px;font-weight:700;margin-bottom:8px"></div>
<div class="ring" id="ring"><div><div class="realm" id="realm"></div><div class="sub" id="qi"></div></div></div>
<div class="root" id="root"></div>
</section>
<div class="stats">
<div class="stat"><b id="age"></b><span>Tuổi</span></div>
<div class="stat"><b id="stone"></b><span>Linh thạch</span></div>
<div class="stat"><b id="legacy"></b><span>Đạo duyên (kiếp <span id="gen"></span>)</span></div>
</div>
<div class="life" title="Thọ nguyên"><i id="lifebar"></i></div>
<div class="sub" id="inv" style="margin:-6px 0 12px"></div>
<div id="log"></div>
<div class="acts">
<button class="main" id="bCult">Tu luyện (1 tháng)</button>
<button id="bYear">Bế quan (1 năm)</button>
<button id="bExp">Thám hiểm (3 tháng)</button>

<button id="bStone">Dùng linh thạch hộ pháp</button>
<button id="bPlant">Thúc linh thảo bằng bình (6 tháng)</button>
<button id="bAlch">Luyện đan (3 linh thảo)</button>
<button id="bPill" style="grid-column:1/-1">Uống đan dược</button>
<button id="bHealP">Chữa thương bằng đan dược (khỏi hẳn)</button>
<button id="bHealS">Chữa thương bằng 2 linh thạch (giảm một bậc)</button>
<button class="seal" id="bBreak" style="grid-column:1/-1">Đột phá</button>
</div>

<div class="foot"><span>Mỗi điểm đạo duyên tăng 5% tốc độ tu luyện ở kiếp sau.</span><button id="bReset">Chơi lại từ đầu</button></div>
<div class="sub" style="margin-top:16px;text-align:center">Tác giả: nhocsukiem. Góp ý: Trinh Dat.</div>
</main>
<script src="js/character.js"></script>
<script src="js/events.js"></script>
<script src="js/game.js"></script>
</body>
</html>
